<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>demo-blog-1</title>

    <script type="module">
        import {
            DemoImg,
            DemoMd,
            DemoA
        } from '../../../../demo-components/dist/demo-components.es.js';
    </script>
    <link rel="stylesheet" href="../../styles/devices.css">
    <style>
        * {
            margin: 0;
            border: 0;
            padding: 0;
            box-sizing: border-box;
        }
    </style>
    <style>
        #container {
            position: relative;
        }

        demo-img {
            width: 100%;
        }

        demo-md {
            padding: 2em;
        }

        #post-meta {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: .5rem;
            font-size: 0.8em;
            color: #cbcbcb;
            padding: 2em 0;
        }
        #post-meta > demo-a {
            --a-color-deselect-x: #cbcbcb;
            --a-color-select-x: #959595;
        }
        #post-meta > * + *{
            position: relative;
        }
        #post-meta > * + *::before {
            content: "·";
            margin-right: .5rem;
            opacity: .5;
        }

    </style>
</head>
<body>

    <div id="host">
        <div id="container">

            <demo-img src="/imgs/office.png" mode="stretched" gradient></demo-img>

            <demo-md src="Universe/Milky Way/Solar System/The Earth/China/Sichuan/Chengdu/Xiling Snow Mountain"></demo-md>

            <div id="post-meta">
                <span>2026-06-21</span>
<!--                <span>·</span>-->
                <demo-a href="https://example.org/" underline smooth newTab>Author</demo-a>
<!--                <span>·</span>-->
                <demo-a href="  " underline smooth newTab>Reposted</demo-a>
            </div>


        </div>
    </div>

</body>
</html>
